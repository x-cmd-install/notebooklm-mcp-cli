{"id":444734515,"author":{"login":"jacob-bd","id":47641890,"node_id":"MDQ6VXNlcjQ3NjQxODkw","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOQtfMFM4aghwz","tag_name":"v0.16.4","target_commitish":"main","name":"v0.16.4: login prompt fix for Typer 0.29","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-11-13T21:01:47Z","updated_at":"2026-11-13T21:04:01Z","published_at":"2026-11-13T21:01:57Z","assets":[{"id":745177394,"node_id":"RA_kwDOQtfMFM4saoEy","name":"notebooklm-mcp-0.16.4.mcpb","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":2606,"digest":"sha256:420ed8a9883cad6d04011eecd96247c3d3158c5e9fb42060f81354222524cf3c","download_count":2,"created_at":"2026-11-13T21:04:01Z","updated_at":"2026-11-13T21:04:01Z"}],"body":"# v0.16.4: login storage question works on Typer 0.29\n\n### Changed\n\n- The CLI and MCP server reach shared core primitives only through the service layer. A new test fails on any direct `core/` import, so the boundary stays enforced (#405).\n\n### Fixed\n\n- Manual login reads cookies from Chrome DevTools \"Copy as cURL\" exports that pass them with `-b` or `--cookie`, including multiline input. Unrecognized input fails with a message naming the accepted formats (#403).\n- `nlm login` asked the new-login plain-or-protected question with a Click range type. Typer 0.29 no longer accepts that type, so the question ended the command with a bare `AssertionError`, and Typer 0.26 to 0.28 stopped on an out-of-range answer instead of asking again. The question now reads the number itself and repeats with \"Please enter 1 or 2.\" until the answer is valid. Enter still chooses protected ([#406](https://github.com/jacob-bd/gemini-notebook-mcp-cli/issues/406), [#407](https://github.com/jacob-bd/gemini-notebook-mcp-cli/pull/407)).\n\n### Credits\n\nThanks to @renepf for the fix and regression tests in #407, and to @Zir0-93 for the layering audit in #405.\n","mentions_count":2}
